site_name: Rognsund for kommende generasjoner
site_description: Åpen, faglig gjennomgang av SalMar Farming AS' planer om akvakultur i Rognsundet, Alta kommune
site_url: https://egkristi.github.io/Rognsund_Oppdrett/
repo_url: https://github.com/egkristi/Rognsund_Oppdrett
repo_name: egkristi/Rognsund_Oppdrett
edit_uri: blob/main/

# Innholdet ligger i rot (README.md) og Salmar_2026/. scripts/build_site.sh
# kopierer det inn i _docs/ før bygging, slik at repo-strukturen kan beholdes.
docs_dir: _docs
site_dir: _site

theme:
  name: material
  language: nb
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Bytt til mørk modus
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Bytt til lys modus
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - search.highlight
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Hjem: index.md
  - Handlingsplan: Salmar_2026/README.md
  - Plan-sammenstilling: Salmar_2026/PLAN-SAMMENSTILLING.md
  - Høringsinnspill:
      - Salmar_2026/Innspill/README.md
      - Innspill til planprogram: Salmar_2026/Innspill/Hoeringsinnspill_planprogram_Rognsund.md
      - Kartlegging av fiskeriinteresser: Salmar_2026/Innspill/Kartlegging_fiskeriinteresser.md
  - Underlag (konvertert):
      - Vedlegg 1 – Planinitiativ: "Salmar_2026/underlag_konvertert/Vedlegg 1 - Planinitiativ.md"
      - Vedlegg 2 – Oppstartsmøtereferat: "Salmar_2026/underlag_konvertert/Vedlegg 2 - Oppstartsmøtereferat.md"
      - Vedlegg 3 – Planprogram: "Salmar_2026/underlag_konvertert/Vedlegg 3 - Planprogram.md"
      - Vedlegg 4 – Personvernerklæring: "Salmar_2026/underlag_konvertert/Vedlegg 4 - Personvernerklæring.md"
      - Varsel om oppstart (Rambøll): "Salmar_2026/underlag_konvertert/D-bre-001 Varsel om oppstart Rognsund.md"
      - Kunngjøring (Rambøll): "Salmar_2026/underlag_konvertert/Kunngjøring_ Rognsund akvakultur - Ramboll - [www.ramboll.com].md"
      - Varsel om oppstart (Alta kommune): "Salmar_2026/underlag_konvertert/Varsel om oppstart av  detaljregulering for akvakultur i Rognsund -_ - [www.alta.kommune.no].md"

# Filer som publiseres, men ikke står i menyen (dubletter/arbeidskopier).
not_in_nav: |
  *(1).md
  *_copy.md

validation:
  links:
    absolute_links: relative_to_docs
    unrecognized_links: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/egkristi/Rognsund_Oppdrett

copyright: Fritt tilgjengelig for alle som ønsker å bruke dokumentasjonen i arbeidet med å bevare Rognsundet.
